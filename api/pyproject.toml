[project]
name = "r2-api"
version = "0.1.0"
description = "POS Copilot API — natural-language query interface and procurement agent"
requires-python = ">=3.12,<3.13"

# No runtime dependencies in Phase 0.
#
# api/scripts/seed.py is stdlib-only by design: it is the one layer in this
# project whose reproducibility can be asserted end-to-end with no model call
# and no API key, and every dependency added here is another thing that can
# move underneath that claim. FastAPI and friends arrive in Phase 1.
# google-auth is the one runtime dependency, and only for RSA-signing a JWT to
# mint a Vertex access token — stdlib cannot do RSA. The HTTP call itself uses
# urllib, so this does not drag in a second HTTP stack. See ADR-0010.
dependencies = [
    "google-auth>=2.35",
    # Phase 1, per ADR-0007: `api/` is FastAPI, JSON + SSE only. uvicorn is the
    # ASGI server it runs under. Both are confined to the serving layer —
    # api/scripts/seed.py stays stdlib-only, so the byte-identity claim still
    # rests on nothing that can move underneath it.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
corpus = [
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "reportlab>=5.0.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "psycopg[binary]>=3.2",
    # starlette's TestClient transport. Test-only on purpose: the serving layer
    # itself makes no outbound HTTP calls, and Vertex is reached over urllib
    # (ADR-0010), so this must not become a runtime dependency.
    "httpx2>=0.28",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["seed/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.flake8-bugbear]
# random.Random(42) substreams are constructed at module import in the seed
# generator's factor tables; that is deliberate, not a mutable-default bug.
extend-immutable-calls = []

[tool.uv]
# No build backend: scripts and modules are imported via pythonpath
# below rather than installed. Nothing here is published as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-q --strict-markers"
markers = [
    "db: requires a seeded Postgres (skipped when TEST_DATABASE_URL is unset)",
]
