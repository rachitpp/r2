[project]
name = "r2-api"
version = "0.1.0"
description = "POS Copilot API — natural-language query interface and procurement agent"
requires-python = ">=3.12,<3.13"

# No runtime dependencies in Phase 0.
#
# api/scripts/seed.py is stdlib-only by design: it is the one layer in this
# project whose reproducibility can be asserted end-to-end with no model call
# and no API key, and every dependency added here is another thing that can
# move underneath that claim. FastAPI and friends arrive in Phase 1.
# google-auth is the one runtime dependency, and only for RSA-signing a JWT to
# mint a Vertex access token — stdlib cannot do RSA. The HTTP call itself uses
# urllib, so this does not drag in a second HTTP stack. See ADR-0010.
dependencies = [
    "google-auth>=2.35",
    # Phase 1, per ADR-0007: `api/` is FastAPI, JSON + SSE only. uvicorn is the
    # ASGI server it runs under. Both are confined to the serving layer —
    # api/scripts/seed.py stays stdlib-only, so the byte-identity claim still
    # rests on nothing that can move underneath it.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
corpus = [
    "docling>=2.118.1",
    "onnxruntime>=1.28.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "reportlab>=5.0.0",
]
# Phase 3, per CLAUDE.md rule 2: embeddings stay LOCAL at every tier, so the
# system a reader runs never needs paid inference for retrieval. torch and
# transformers are already here via the `corpus` group; this group exists
# because query embedding happens at SERVE time, not only at ingest, so the
# runtime path needs them too. No sentence-transformers — bge-small is a BERT
# encoder and the pooling is four lines in pos_copilot/embed.py, written out
# where it can be read.
retrieval = [
    "torch>=2.13",
    "transformers>=5.8",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "psycopg[binary]>=3.2",
    # starlette's TestClient transport. Test-only on purpose: the serving layer
    # itself makes no outbound HTTP calls, and Vertex is reached over urllib
    # (ADR-0010), so this must not become a runtime dependency.
    "httpx2>=0.28",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["seed/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.flake8-bugbear]
# random.Random(42) substreams are constructed at module import in the seed
# generator's factor tables; that is deliberate, not a mutable-default bug.
extend-immutable-calls = []

[tool.uv]
# No build backend: scripts and modules are imported via pythonpath
# below rather than installed. Nothing here is published as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
    "db: requires a seeded Postgres (skipped when TEST_DATABASE_URL is unset)",
    # Loads the local embedding model. No key and no quota — but the first run
    # downloads ~130MB of weights, so CI and the fast loop skip it by default
    # and `make test-slow` opts in.
    "slow: loads the local embedding model (deselected unless -m slow)",
]
# `slow` is deselected by default so the ordinary loop stays under two seconds.
# The embedding assertions are the ones that catch a pooling change, so they
# must actually be run at phase boundaries, not merely exist.
